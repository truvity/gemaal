---
# Source: gemaal/templates/configmap.yaml
# The service configuration. dryRun is rendered from `confirm` — the
# one deliberate flip — so a values file cannot half-say it: absent
# confirm means dryRun: true means shadow mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gemaal-config
  labels:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: gemaal-0.0.0
data:
  config.yaml: |
    dryRun: true
    allowList:
      s3Buckets: []
      ssmRoots:
      - /test/
    authz:
      adminGroups: []
      audience: ""
      groupPrefix: 'emp:'
      issuerURL: ""
      tokenAudiences: []
    awsRegion: ""
    grace: 48h
    hold:
      default: 8h
      max: 168h
    housekeepingInterval: 1m
    identity:
      emails: {}
      personalNamespace: emp-{slug}
    labelDomain: gemaal.io
    tierLabel: tenancy.truvity.io/tier
    tiers:
      ci:
        ttl: 24h
      employee:
        ttl: 14h

---
# Source: gemaal/templates/rbac.yaml
# The watcher's read set. Cluster-scoped because tenancy namespaces come
# and go and RBAC cannot select by label:
#
#   - namespaces: the tier-label selection (`kubectl get ns -l ...`)
#   - secrets: helm's release truth AND the label ledger — reads plus
#     the keep-until patch (Checkout/Extend). This is the price of the
#     no-store design; the role holds NO other secret-bearing verbs.
#   - tokenreviews: authenticating workload callers (the mutations).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gemaal-watch
  labels:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: gemaal-0.0.0
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, patch]
  # The harness's claim Leases: Decommission refuses while one is LIVE
  # (a suite is running against the tenant). Read-only — the service
  # never writes claims, it only respects them.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]

---
# Source: gemaal/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gemaal-watch
  labels:
