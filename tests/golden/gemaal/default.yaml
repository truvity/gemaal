---
# Source: gemaal/templates/networkpolicy.yaml
# Egress-only: DNS, TLS for the API server and AWS SSM, and the EKS Pod
# Identity credential endpoint (cleartext HTTP on a link-local address —
# the eks-pod-identity-agent on the node; without this rule the SDK's
# credential fetch times out and every SSM sweep hangs minutes into a
# credential error). Ingress (from the gateway fleet to the panel/RPC)
# is deployer-owned and lives next to the exposure — the expose-a-ui
# split.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gemaal-egress
  labels:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: gemaal-0.0.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gemaal
      app.kubernetes.io/instance: gemaal
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 443 carries GitHub + AWS APIs — including STS, which is the
    # ENTIRE credential path under IRSA (the web-identity token is a
    # projected file; no extra egress needed). Both auth modes are
    # first-class here, not accidents of each other's allowances.
    - ports:
        - port: 443
          protocol: TCP
    # EKS Pod Identity's credential endpoint: the node-local agent at a
    # link-local address, plain HTTP. Harmless under IRSA (nothing
    # dials it); required under PIA.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - port: 80
          protocol: TCP

