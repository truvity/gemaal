    name: gemaal
    namespace: default

---
# Source: gemaal/templates/service.yaml
# The one thing the exposure chain needs from this chart: the Service
# the deployer's HTTPRoute targets (RPC, panel and healthz share the
# listener).
apiVersion: v1
kind: Service
metadata:
  name: gemaal
  labels:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: gemaal-0.0.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Source: gemaal/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemaal
  labels:
    app.kubernetes.io/name: gemaal
    app.kubernetes.io/instance: gemaal
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: gemaal-0.0.0
spec:
  # One replica on purpose: the housekeeping loop is not leader-elected,
  # and two pumps would race their uninstalls.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gemaal
      app.kubernetes.io/instance: gemaal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemaal
        app.kubernetes.io/instance: gemaal
      annotations:
        checksum/config: d67c627d127263b430f17cae391ebe831f96525b452887fa1bc569e4a42f0132
    spec:
      serviceAccountName: gemaal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gemaal
          image: "ghcr.io/truvity/gemaal/server:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/gemaal/config.yaml
          env:
            # uid 65532 has no passwd entry in the alpine/k8s base, so
            # the runtime would default HOME to "/" — unwritable on the
            # read-only rootfs. Pin helm/kubectl caches to the emptyDir.
            - name: HOME
              value: /home/nonroot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gemaal
              readOnly: true
            # helm's cache/config; the root filesystem is read-only.
            - name: helm-home
              mountPath: /home/nonroot
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gemaal-config
        - name: helm-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
