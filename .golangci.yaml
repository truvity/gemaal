version: "2"

linters:
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - unused

  # v2 schema: settings live UNDER linters. A top-level `linters-settings:`
  # block is accepted silently by `run` (only `golangci-lint config verify`
  # rejects it), which is how such values once spent a release doing
  # nothing in a sibling repo — lll fell back to the 120-column default and
  # the extra gocritic checks never ran.
  settings:
    lll:
      line-length: 160
    gocritic:
      enabled-checks:
        # Opt-in (performance tag); the diagnostics tag — which already
        # carries exitAfterDefer — is on by default, so listing that one
        # here only earns a "no need to enable" warning.
        - rangeValCopy

  exclusions:
    # gen/ is buf output, committed for `go get`-ability but never hand-edited.
    paths:
      - gen

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
