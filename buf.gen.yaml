version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/truvity/gemaal/gen
plugins:
  # Local plugins (installed via devbox: protoc-gen-go, protoc-gen-connect-go)
  # to avoid BSR rate limits.
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
