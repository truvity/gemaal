{{- if .Values.networkPolicy.enabled }}
# Egress-only: DNS, plus TLS for the API server and AWS SSM. Ingress
# (from the gateway fleet to the panel/RPC) is deployer-owned and lives
# next to the exposure — the expose-a-ui split.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gemaal.fullname" . }}-egress
  labels:
    {{- include "gemaal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gemaal.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
