{{- if .Values.networkPolicy.enabled }}
# Egress-only: DNS, TLS for the API server and AWS SSM, and the EKS Pod
# Identity credential endpoint (cleartext HTTP on a link-local address —
# the eks-pod-identity-agent on the node; without this rule the SDK's
# credential fetch times out and every SSM sweep hangs minutes into a
# credential error). Ingress (from the gateway fleet to the panel/RPC)
# is deployer-owned and lives next to the exposure — the expose-a-ui
# split.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gemaal.fullname" . }}-egress
  labels:
    {{- include "gemaal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gemaal.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - port: 80
          protocol: TCP
{{- end }}
